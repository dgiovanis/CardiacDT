[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cardiac-dt"
version = "0.2.0"
description = "Diffusion maps and probabilistic learning on manifolds for cardiac digital twins"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.24,<2", "scipy>=1.10,<1.14", "matplotlib>=3.7,<4",
  "scikit-learn==1.2.2", "datafold==2.0.1", "pandas>=2,<3"
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<7"]

[project.scripts]
cardiac-dt = "cardiac_dt.cli:main"
cardiac-dt-reproduce = "cardiac_dt.reproduce:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
